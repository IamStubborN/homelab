default_config:

homeassistant:
  external_url: "https://host-8.example.invalid"
  internal_url: "http://host-9.example.invalid:8123"

# HTTP / trusted proxies are configured in the HA UI (Settings → System → Network),
# not in YAML. Live config no longer ships an `http:` block. If restoring from
# scratch behind Traefik, set use_x_forwarded_for + trusted_proxies in the UI
# (or temporarily in YAML) to include the Docker proxy network / Traefik IPs.

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

command_line:
  # Local CozyLife smart plug control. Replace the IP with a DHCP-reserved address.
  - switch:
      name: girlianda
      unique_id: cozylife_garland_power
      icon: mdi:string-lights
      command_on: python3 /config/scripts/cozylife_socket.py 192.0.2.201 on
      command_off: python3 /config/scripts/cozylife_socket.py 192.0.2.201 off
      command_state: python3 /config/scripts/cozylife_socket.py 192.0.2.201 state
      value_template: '{{ value == "ON" }}'
      command_timeout: 8
      scan_interval: 30
