services:
  karakeep-web:
    container_name: karakeep-web
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/web:/data
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

      OPENAI_BASE_URL: http://omniroute:20129/v1
      OPENAI_API_KEY: ${KARAKEEP_OMNIROUTE_KEY:?set KARAKEEP_OMNIROUTE_KEY}

      INFERENCE_TEXT_MODEL: opencode-go/deepseek-v4-flash
      INFERENCE_IMAGE_MODEL: opencode-go/deepseek-v4-flash
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: true
      INFERENCE_JOB_TIMEOUT_SEC: 600
      INFERENCE_CONTEXT_LENGTH: 32768

      # Embeddings via local Ollama bge-m3. Do not set OLLAMA_BASE_URL:
      # that would steal tagging/summaries from Omniroute. IPEX ignores
      # encoding_format=base64, so the OpenAI SDK would store 256 garbage
      # dims; karakeep-embed-proxy packs native /api/embed as base64 f32.
      EMBEDDING_OPENAI_BASE_URL: http://karakeep-embed-proxy:8080/v1
      EMBEDDING_OPENAI_API_KEY: ollama
      EMBEDDING_TEXT_MODEL: bge-m3
      EMBEDDING_DIMENSIONS: 1024
      EMBEDDING_ENABLE_AUTO_INDEXING: true

      # Allow crawler to access internal hostnames
      CRAWLER_ALLOWED_INTERNAL_HOSTNAMES: ${KARAKEEP_CRAWLER_ALLOWED_INTERNAL_HOSTNAMES}

      DATA_DIR: /data # DON'T CHANGE THIS
    depends_on:
      chrome:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      karakeep-embed-proxy:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.karakeep.tls=true"
      - "traefik.http.routers.karakeep.entrypoints=http,https"
      - "traefik.http.routers.karakeep.rule=Host(`karakeep.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.karakeep.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - karakeep-internal
      - agent-tools

  karakeep-embed-proxy:
    container_name: karakeep-embed-proxy
    image: python:3.12-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["python", "/app/embed-proxy.py"]
    volumes:
      - ./embed-proxy.py:/app/embed-proxy.py:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - karakeep-internal
      - agent-tools

  chrome:
    container_name: karakeep-chrome
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    networks:
      - karakeep-internal

  meilisearch:
    container_name: karakeep-meilisearch
    image: getmeili/meilisearch:v1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - ./data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

    networks:
      - karakeep-internal

networks:
  karakeep-internal:
    internal: true
  proxy:
    external: true
  agent-tools:
    name: agent-tools
