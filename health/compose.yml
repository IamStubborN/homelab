x-locked-down: &locked-down
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  health-service:
    <<: *locked-down
    build:
      context: ./mcp
    # Python cashier. Do not reuse a leftover Rust family-health-service:local.
    image: family-health-mcp:local
    container_name: health-service
    # Wiki writes + token files: UID 10000. Host API tokens must be
    # `10000:10000 0400` (`install -o 10000 -g 10000 -m 0400`).
    user: "10000:10000"
    restart: unless-stopped
    read_only: true
    pids_limit: 128
    environment:
      HEALTH_TOKEN_FILE_ANDRII: /run/secrets/andrii_health_api_token
      HEALTH_TOKEN_FILE_VALENTYNA: /run/secrets/valentyna_health_api_token
      HEALTH_LISTEN_ADDR: 0.0.0.0:8080
      WIKI_HEALTH_ROOT: /wiki/shared/health
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp
      HOME: /tmp
      TZ: ${TIMEZONE:-UTC}
    secrets:
      - andrii_health_api_token
      - valentyna_health_api_token
    volumes:
      - ${WIKI_ROOT:-/mnt/internal/wiki}/shared/health:/wiki/shared/health
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    expose: ["8080"]
    networks: [health-internal]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

networks:
  health-internal:
    name: health-internal
    external: true

secrets:
  andrii_health_api_token:
    file: ./secrets/andrii.health_api_token
  valentyna_health_api_token:
    file: ./secrets/valentyna.health_api_token
