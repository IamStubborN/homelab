services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim-rootless
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TIMEZONE:-UTC}
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - ./data:/app/data
      - ./tools:/app/tools:ro
    mem_limit: 512m
    cpus: 0.5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=${UPTIME_KUMA_INGRESS_ENABLED:-false}"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.uptime-kuma.rule=Host(`uptime.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=https"
      - "traefik.http.routers.uptime-kuma.tls=true"
      - "traefik.http.routers.uptime-kuma.middlewares=uptime-kuma-lan,uptime-kuma-headers"
      - "traefik.http.middlewares.uptime-kuma-lan.ipallowlist.sourcerange=${LAN_SUBNET:-127.0.0.1/32}"
      - "traefik.http.middlewares.uptime-kuma-headers.headers.customResponseHeaders.Referrer-Policy=no-referrer"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
      - "traefik.http.routers.uptime-kuma-observer.rule=Host(`uptime.${DOCKER_DOMAIN}`) && Path(`/api/entry-page`) && Method(`GET`)"
      - "traefik.http.routers.uptime-kuma-observer.entrypoints=https"
      - "traefik.http.routers.uptime-kuma-observer.tls=true"
      - "traefik.http.routers.uptime-kuma-observer.priority=350"
      - "traefik.http.routers.uptime-kuma-observer.service=uptime-kuma"
      - "traefik.http.routers.uptime-kuma-observer.middlewares=uptime-kuma-observer-sources,uptime-kuma-headers"
      - "traefik.http.middlewares.uptime-kuma-observer-sources.ipallowlist.sourcerange=${UPTIME_KUMA_OBSERVER_SOURCES:-${LAN_SUBNET:-127.0.0.1/32}}"
    healthcheck:
      test: ["CMD", "node", "/app/tools/healthcheck.cjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - proxy

networks:
  proxy:
    external: true
