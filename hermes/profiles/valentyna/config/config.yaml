terminal:
  backend: local
  cwd: /opt/data/workspace
  home_mode: profile
  timeout: 180

model:
  provider: openai-api
  base_url: http://omniroute:20129/v1
  default: gpt-5.6-luna

fallback_providers:
  - provider: openai-api
    base_url: http://omniroute:20129/v1
    model: gpt-5.6-terra
  - provider: openai-api
    base_url: http://omniroute:20129/v1
    model: gpt-5.6-sol

browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  camofox:
    managed_persistence: false

web:
  search_backend: null
  extract_backend: firecrawl

tools:
  tool_search:
    enabled: auto
    listing: auto
    listing_max_tokens: 1000

mcp_servers:
  media_admin:
    url: http://media-service:8080/internal/mcp
    lazy: true
    headers:
      Authorization: "Bearer ${MEDIA_API_TOKEN}"
    tools:
      resources: false
      prompts: false
  home_assistant:
    url: http://192.168.1.4:8123/api/mcp
    lazy: true
    headers:
      Authorization: "Bearer ${HOMEASSISTANT_API_TOKEN}"
    tools:
      resources: false
      prompts: false
  health:
    url: ${HEALTH_MCP_URL}
    lazy: true
    headers:
      Authorization: "Bearer ${HEALTH_API_TOKEN}"
    tools:
      resources: false
      prompts: false

platform_toolsets:
  telegram: [terminal, web, browser, skills]

platforms:
  telegram:
    reply_to_mode: first
    extra:
      command_menu:
        priority_mode: prepend
        priority:
          - media
          - watching
          - movies
          - series
          - trending
  webhook: null

display:
  tool_progress: new
  memory_notifications: "off"
  platforms:
    telegram:
      tool_progress: "off"
compression:
  codex_responses_native: true
skills:
  creation_nudge_interval: 10
  platform_disabled:
    telegram: &disabled-telegram-skills
      - airtable
      - architecture-diagram
      - ascii-art
      - ascii-video
      - audiocraft-audio-generation
      - baoyu-infographic
      - blogwatcher
      - claude-code
      - claude-design
      - codebase-inspection
      - codex
      - comfyui
      - computer-use
      - design-md
      - dogfood
      - evaluating-llms-harness
      - excalidraw
      - gif-search
      - github-auth
      - github-code-review
      - github-issues
      - github-pr-workflow
      - github-repo-management
      - heartmula
      - hermes-agent-skill-authoring
      - himalaya
      - huggingface-hub
      - humanizer
      - jupyter-live-kernel
      - llama-cpp
      - llm-wiki
      - manim-video
      - nano-pdf
      - node-inspect-debugger
      - notion
      - opencode
      - openhue
      - p5js
      - petdex
      - plan
      - polymarket
      - popular-web-designs
      - powerpoint
      - pretext
      - python-debugpy
      - requesting-code-review
      - segment-anything-model
      - serving-llms-vllm
      - simplify-code
      - sketch
      - songsee
      - songwriting-and-ai-music
      - spike
      - systematic-debugging
      - teams-meeting-pipeline
      - test-driven-development
      - touchdesigner-mcp
      - weights-and-biases
      - xurl
      - yuanbao
agent:
  verify_on_stop: false
  service_tier: fast
  reasoning_effort: low
  reasoning_overrides:
    gpt-5.6-terra: high
    gpt-5.6-luna: high
    gpt-5.6-sol: low
plugins:
  enabled: [telegram-home]
_config_version: 33
