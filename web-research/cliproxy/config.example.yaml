host: ""
port: 8317

remote-management:
  allow-remote: true
  secret-key: ""
  disable-control-panel: false
  disable-auto-update-panel: false

auth-dir: "/data/auths"

# Replace this in the ignored config.yaml. Add one key per client from the
# management UI so individual consumers can be revoked independently.
api-keys:
  - "replace-with-CLIPROXY_FIRECRAWL_KEY"

debug: false
pprof:
  enable: false
  addr: "127.0.0.1:8316"

plugins:
  enabled: false
  dir: "plugins"

logging-to-file: false
usage-statistics-enabled: true
request-retry: 2
max-retry-credentials: 2

routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "1h"

codex:
  identity-confuse: false
  disable-codex-cloaking: false
  optimize-multi-agent-v2: false

ws-auth: true
