services:
  hindsight-db:
    image: pgvector/pgvector:pg17@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
    container_name: hindsight-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD}
      POSTGRES_DB: hindsight
    volumes:
      - hindsight_postgres:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hindsight -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hindsight-backend

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.9.0@sha256:6364c3c5f1e551447976d6c3ab369040d0237c0980f10f911d76d981290913b6
    container_name: hindsight
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      hindsight-db:
        condition: service_healthy
    environment:
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: "8888"
      HINDSIGHT_API_LOG_LEVEL: info
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD}@hindsight-db:5432/hindsight

      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: http://omniroute:20129/v1
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_OMNIROUTE_KEY:?set HINDSIGHT_OMNIROUTE_KEY}
      HINDSIGHT_API_LLM_MODEL: opencode-go/gpt-5.6-luna
      HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
      HINDSIGHT_API_LLM_TRACE_ENABLED: "false"
      HINDSIGHT_API_QUERY_ANALYZER_LANGUAGES: en,ru,uk
      HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT: "1"

      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${HINDSIGHT_OMNIROUTE_KEY:?set HINDSIGHT_OMNIROUTE_KEY}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://omniroute:20129/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ollama-ipex/bge-m3:latest
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: "1024"
      HINDSIGHT_API_RERANKER_PROVIDER: cohere
      HINDSIGHT_API_RERANKER_COHERE_API_KEY: ${HINDSIGHT_OMNIROUTE_KEY:?set HINDSIGHT_OMNIROUTE_KEY}
      HINDSIGHT_API_RERANKER_COHERE_BASE_URL: http://omniroute:20129/v1/rerank
      HINDSIGHT_API_RERANKER_COHERE_MODEL: nvidia/nv-rerank-qa-mistral-4b:1

      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TOKEN:?set HINDSIGHT_API_TOKEN}
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_API_TOKEN:?set HINDSIGHT_API_TOKEN}
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_API_TOKEN:?set HINDSIGHT_API_TOKEN}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:8888/health]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.hindsight.rule=Host(`hindsight.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.hindsight.entrypoints=https"
      - "traefik.http.routers.hindsight.tls=true"
      - "traefik.http.routers.hindsight.service=hindsight-ui"
      - "traefik.http.services.hindsight-ui.loadbalancer.server.port=9999"
      - "traefik.http.routers.hindsight-api.rule=Host(`hindsight.${DOCKER_DOMAIN}`) && (PathPrefix(`/v1`) || PathPrefix(`/mcp`) || Path(`/health`) || Path(`/openapi.json`) || PathPrefix(`/docs`) || Path(`/metrics`))"
      - "traefik.http.routers.hindsight-api.entrypoints=https"
      - "traefik.http.routers.hindsight-api.tls=true"
      - "traefik.http.routers.hindsight-api.priority=100"
      - "traefik.http.routers.hindsight-api.service=hindsight-api"
      - "traefik.http.services.hindsight-api.loadbalancer.server.port=8888"
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - agent-tools
      - hindsight-backend
      - proxy

networks:
  agent-tools:
    name: agent-tools
  hindsight-backend:
    internal: true
  proxy:
    external: true

volumes:
  hindsight_postgres:
