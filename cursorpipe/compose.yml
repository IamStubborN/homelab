services:
  cursorpipe:
    image: ghcr.io/abhi5h3k/cursorpipe:v2@sha256:6522390f3f74d8ac4e7a45b8b170952f891b34a693efc2caa70d602c905b55f7
    container_name: cursorpipe
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CURSOR_API_KEY: ${CURSOR_API_KEY:?set CURSOR_API_KEY}
      CURSORPIPE_HOST: 0.0.0.0
      CURSORPIPE_PORT: "8080"
      CURSORPIPE_BEARER_TOKEN: ${CURSORPIPE_BEARER_TOKEN:?set CURSORPIPE_BEARER_TOKEN}
      CURSORPIPE_MODEL: composer-2.5
      CURSORPIPE_WORKSPACE: /workspace
      CURSORPIPE_SESSION_TTL_MINUTES: "30"
      CURSORPIPE_THINKING_LEVEL: off
      CURSORPIPE_LOG_LEVEL: info
      HOME: /workspace
    volumes:
      - cursorpipe_workspace:/workspace
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - agent-tools

networks:
  agent-tools:
    name: agent-tools

volumes:
  cursorpipe_workspace:
