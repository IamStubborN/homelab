http:
  routers:
    http-catchall-redirect:
      rule: "HostRegexp(`^.+$`)"
      entryPoints:
        - http
      middlewares:
        - redirect-to-https
      service: api@internal
      priority: 1

    # Keep legacy TorrServer hashes on its existing route; numeric Lampac
    # session IDs isolate simultaneous browser viewers.
    lampa-gst-sessions:
      rule: "Host(`lampa.${DOCKER_DOMAIN}`) && (PathRegexp(`^/gst/[0-9]{1,20}/`) || PathRegexp(`^/gst/(add|probe|start[.]m3u8|remove)$`) || Path(`/gst.js`))"
      entryPoints: [https]
      tls: {}
      priority: 120
      service: lampa@docker
      middlewares: [lampa-forwarded@docker]

    homeassistant:
      rule: "Host(`homeassistant.${DOCKER_DOMAIN}`)"
      entryPoints:
        - https
      tls:
        certResolver: cloudflare
      service: homeassistant

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://${LAN_BIND_IP:-127.0.0.1}:8123"

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

