[project]
name = "health-mcp"
version = "0.1.0"
description = "Family health MCP cashier: append-only jsonl, no SQL."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.0.0",
    "uvicorn==0.52.4",
    "starlette==1.6.0",
    "sse-starlette==3.4.8",
    "matplotlib==3.11.1",
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
