services:
  omniroute-redis:
    image: redis:8-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - omniroute_redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - omniroute-backend

  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      omniroute-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "20128"
      API_PORT: "20129"
      HOSTNAME: 0.0.0.0
      API_HOST: 0.0.0.0
      DATA_DIR: /app/data
      REDIS_URL: redis://omniroute-redis:6379
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:?set OMNIROUTE_JWT_SECRET}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:?set OMNIROUTE_API_KEY_SECRET}
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY:?set OMNIROUTE_STORAGE_ENCRYPTION_KEY}
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?set OMNIROUTE_INITIAL_PASSWORD}
      REQUIRE_API_KEY: "true"
      AUTH_COOKIE_SECURE: "true"
      NEXT_PUBLIC_BASE_URL: https://omniroute.${DOCKER_DOMAIN}
      BASE_URL: http://127.0.0.1:20128
      OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS: "true"
      CURSORPIPE_BEARER_TOKEN: ${CURSORPIPE_BEARER_TOKEN:?set CURSORPIPE_BEARER_TOKEN}
    command: [/bin/sh, /app/patches/start.sh]
    volumes:
      - omniroute_data:/app/data
      - ./start.sh:/app/patches/start.sh:ro
    ports:
      - "127.0.0.1:20129:20129"
    mem_limit: 2g
    healthcheck:
      test: [CMD, node, healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.omniroute.rule=Host(`omniroute.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.omniroute.entrypoints=https"
      - "traefik.http.routers.omniroute.tls=true"
      - "traefik.http.services.omniroute.loadbalancer.server.port=20128"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - agent-tools
      - omniroute-backend
      - proxy

networks:
  agent-tools:
    name: agent-tools
  omniroute-backend:
    internal: true
  proxy:
    external: true

volumes:
  omniroute_data:
  omniroute_redis:
