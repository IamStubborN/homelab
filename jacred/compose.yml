services:
  jacred:
    build:
      context: ./build
    image: homelab/jacred:20260926-crawl-recovery
    container_name: jacred
    restart: unless-stopped
    stop_grace_period: 60s
    # Keep background indexing below one core and yield during contention.
    cpus: "0.6"
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TIMEZONE:-Europe/Sofia}
      UMASK: "0027"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    depends_on:
      solverr:
        condition: service_healthy
      solverr-crawl:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./data:/app/Data
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "10", "http://127.0.0.1:9117/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=true"
      - "traefik.docker.network=jacred"
      - "traefik.http.routers.lampa-jacred.tls=true"
      - "traefik.http.routers.lampa-jacred.entrypoints=https"
      - "traefik.http.routers.lampa-jacred.rule=Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/jacred`)"
      - "traefik.http.routers.lampa-jacred.priority=110"
      - "traefik.http.routers.lampa-jacred.middlewares=lampa-jacred-strip"
      - "traefik.http.middlewares.lampa-jacred-strip.stripprefix.prefixes=/jacred"
      - "traefik.http.services.lampa-jacred.loadbalancer.server.port=9117"
    # Not on `proxy`: its config API returns tracker passwords and cookies to
    # any container that can reach it, so only its own clients share this network.
    networks:
      - jacred

  jacred-cron:
    build:
      context: ./scheduler
    container_name: jacred-cron
    restart: unless-stopped
    init: true
    depends_on:
      jacred:
        condition: service_healthy
    environment:
      TZ: ${TIMEZONE:-Europe/Sofia}
      CURL_CONNECT_TIMEOUT: "10"
      LOCK_DIR: /tmp/jacred-cron-locks
      TELEGRAM_CHAT_ID: ${PRIMARY_TELEGRAM_CHAT_ID}
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets:
      - telegram_bot_token
    volumes:
      - ./data/log:/var/log/jacred
    networks:
      - jacred

networks:
  # JacRed and its clients: Lampac, Solverr, the scheduler, Traefik and the
  # TorrServer it analyses tracks with. Not internal: JacRed crawls trackers.
  # Created once like `proxy`: docker network create jacred
  jacred:
    name: jacred
    external: true
