# Vaultwarden (Bitwarden-compatible)
# LAN:  https://bitwarden.${DOCKER_DOMAIN}
# Public Send/links: https://bitwarden.example.test (Cloudflare Tunnel; no Access)
#
# Tunnel token: ignored bitwarden/secrets/tunnel.env (TUNNEL_TOKEN=...)
# Create tunnel in Cloudflare Zero Trust → Networks → Tunnels → public
# hostname bitwarden.example.test → http://bitwarden:80

services:
  bitwarden:
    image: vaultwarden/server:latest
    container_name: bitwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${BITWARDEN_PUBLIC_URL:-https://bitwarden.example.test}
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - ./data:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.stop-timeout=60s"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.bitwarden.tls=true"
      - "traefik.http.routers.bitwarden.entrypoints=http,https"
      - "traefik.http.routers.bitwarden.rule=Host(`bitwarden.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.bitwarden.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://127.0.0.1:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy

  # Public ingress for Send links / remote vault access (no Cloudflare Access).
  bitwarden-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bitwarden-cloudflared
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate run
    env_file:
      - ./secrets/tunnel.env
    depends_on:
      bitwarden:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - proxy

networks:
  proxy:
    external: true
