global:
  sendAnonymousUsage: false

api:
  dashboard: true
  debug: false

entryPoints:
  http:
    address: ":80"
  https:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    filename: /config.yml

certificatesResolvers:
  cloudflare:
    acme:
      storage: acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        # Port 53 is intercepted on this network, including authoritative queries.
        resolvers:
          - "9.9.9.9:9953"
          - "149.112.112.112:9953"
        propagation:
          disableANSChecks: true
          requireAllRNS: true

log:
  level: "INFO"
