[workspace]
members = [
  "crates/health-core",
  "crates/health-migration",
  "crates/health-service",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.0"
version = "0.1.0"
publish = false

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["json"] }
base64 = "=0.22.1"
hex = "=0.4.3"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
plotters = { version = "=0.3.7", default-features = false, features = ["ab_glyph", "bitmap_backend", "line_series"] }
rmcp = { version = "=3.1.0", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
sea-orm = { version = "=2.0.0-rc.42", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-json", "with-time", "with-uuid"] }
sea-orm-migration = { version = "=2.0.0-rc.42", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "with-json", "with-time", "with-uuid"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
tempfile = "=3.23.0"
thiserror = "=2.0.18"
time = { version = "=0.3.53", default-features = false, features = ["std", "serde", "formatting", "parsing", "macros"] }
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.20"
uuid = { version = "=1.23.4", features = ["v4", "serde"] }

health-core = { path = "crates/health-core" }
health-migration = { path = "crates/health-migration" }
