x-firecrawl-environment: &firecrawl-environment
  REDIS_URL: redis://firecrawl-redis:6379
  REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
  POSTGRES_USER: firecrawl
  POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?set FIRECRAWL_POSTGRES_PASSWORD}
  POSTGRES_DB: postgres
  POSTGRES_HOST: firecrawl-postgres
  POSTGRES_PORT: "5432"
  USE_DB_AUTHENTICATION: "false"
  NUM_WORKERS_PER_QUEUE: "2"
  CRAWL_CONCURRENT_REQUESTS: "2"
  MAX_CONCURRENT_JOBS: "2"
  BROWSER_POOL_SIZE: "2"
  NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
  BULL_AUTH_KEY: ${FIRECRAWL_BULL_AUTH_KEY:?set FIRECRAWL_BULL_AUTH_KEY}
  LOGGING_LEVEL: info
  ENV: local
  SEARXNG_ENDPOINT: http://searxng:8080
  OPENAI_BASE_URL: http://cli-proxy-api:8317/v1
  OPENAI_API_KEY: ${CLIPROXY_FIRECRAWL_KEY:?set CLIPROXY_FIRECRAWL_KEY}
  MODEL_NAME: gpt-5.3-codex-spark(high)

services:
  omniroute-redis:
    image: redis:8-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - omniroute_redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - web-research-backend

  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      omniroute-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "20128"
      API_PORT: "20129"
      HOSTNAME: 0.0.0.0
      API_HOST: 0.0.0.0
      DATA_DIR: /app/data
      REDIS_URL: redis://omniroute-redis:6379
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:?set OMNIROUTE_JWT_SECRET}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:?set OMNIROUTE_API_KEY_SECRET}
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY:?set OMNIROUTE_STORAGE_ENCRYPTION_KEY}
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?set OMNIROUTE_INITIAL_PASSWORD}
      REQUIRE_API_KEY: "false"
      AUTH_COOKIE_SECURE: "true"
      NEXT_PUBLIC_BASE_URL: https://omniroute.${DOCKER_DOMAIN}
      BASE_URL: http://127.0.0.1:20128
      OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS: "true"
    volumes:
      - omniroute_data:/app/data
    mem_limit: 1g
    healthcheck:
      test: [CMD, node, healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.omniroute.rule=Host(`omniroute.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.omniroute.entrypoints=https"
      - "traefik.http.routers.omniroute.tls=true"
      - "traefik.http.services.omniroute.loadbalancer.server.port=20128"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - agent-tools
      - web-research-backend
      - proxy

  search-ladder:
    image: ghcr.io/iamstubborn/search-ladder:latest
    container_name: search-ladder
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      omniroute:
        condition: service_healthy
    environment:
      OMNIROUTE_URL: http://omniroute:20129
      OMNIROUTE_API_KEY: ${SEARCH_LADDER_OMNIROUTE_KEY:?set SEARCH_LADDER_OMNIROUTE_KEY}
      BROKER_API_KEY: ${SEARCH_LADDER_API_KEY:?set SEARCH_LADDER_API_KEY}
      DB_PATH: /data/search-ladder.db
      QUOTA_COOLDOWN: 12h
    volumes:
      - search_ladder_data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    mem_limit: 128m
    healthcheck:
      test: [CMD, search-ladder, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.search-ladder.rule=Host(`search-ladder.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.search-ladder.entrypoints=https"
      - "traefik.http.routers.search-ladder.tls=true"
      - "traefik.http.services.search-ladder.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - agent-tools
      - proxy

  searxng:
    image: ghcr.io/searxng/searxng@sha256:f433294b46a93564993c4371005341e013d94aa8ea4662d8ee521cd2cccb08e8
    container_name: searxng
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.routers.searxng.entrypoints=http,https"
      - "traefik.http.routers.searxng.rule=Host(`search.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    networks:
      - agent-tools
      - proxy

  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    pull_policy: always
    container_name: cli-proxy-api
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      MANAGEMENT_PASSWORD: ${CLIPROXY_MANAGEMENT_PASSWORD:?set CLIPROXY_MANAGEMENT_PASSWORD}
      MANAGEMENT_STATIC_PATH: /data/static
    command: [./CLIProxyAPI, -config, /data/config.yaml]
    volumes:
      - ./cliproxy:/data
    mem_limit: 512m
    cpus: 1.0
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cli-proxy-api.tls=true"
      - "traefik.http.routers.cli-proxy-api.entrypoints=http,https"
      - "traefik.http.routers.cli-proxy-api.rule=Host(`llm.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.cli-proxy-api.loadbalancer.server.port=8317"
    networks:
      - agent-tools
      - proxy

  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl@sha256:ad3049ae703d6c6438211ee084e20fcf5eaa0f1cfef54351393df1ca6faff190
    container_name: firecrawl-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *firecrawl-environment
      HOST: 0.0.0.0
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      # ponytail: cold starts share two CPUs across all bundled workers; allow slow initialization.
      HARNESS_STARTUP_TIMEOUT_MS: "600000"
    command: node dist/src/harness.js --start-docker
    depends_on:
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-redis:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_started
      cli-proxy-api:
        condition: service_started
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.firecrawl.tls=true"
      - "traefik.http.routers.firecrawl.entrypoints=http,https"
      - "traefik.http.routers.firecrawl.rule=Host(`crawl.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.firecrawl.loadbalancer.server.port=3002"
    networks:
      - agent-tools
      - web-research-backend
      - proxy

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service@sha256:6359b0d9070f27400b4a9b615509be06919e40121fc1fdc42d4efeddf02653d2
    container_name: firecrawl-playwright
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: "2"
      BLOCK_MEDIA: "true"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    shm_size: 512m
    mem_limit: 2g
    cpus: 1.5
    networks:
      - agent-tools
      - web-research-backend

  firecrawl-redis:
    image: redis:8-alpine
    container_name: firecrawl-redis
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    tmpfs:
      - /data:rw,nosuid,nodev,noexec,size=256m
    mem_limit: 320m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web-research-backend

  firecrawl-rabbitmq:
    image: rabbitmq:3-alpine
    container_name: firecrawl-rabbitmq
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/lib/rabbitmq:rw,nosuid,nodev,noexec,size=256m
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    mem_limit: 384m
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web-research-backend

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6
    container_name: firecrawl-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?set FIRECRAWL_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - firecrawl_postgres:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U firecrawl -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - web-research-backend

networks:
  agent-tools:
    name: agent-tools
  web-research-backend:
    internal: true
  proxy:
    external: true

volumes:
  firecrawl_postgres:
  omniroute_data:
  omniroute_redis:
  search_ladder_data:
