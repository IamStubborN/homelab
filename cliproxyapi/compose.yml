# CLIProxyAPI — OpenAI-compatible gateway for Codex (gpt-6-luna) OAuth.
# Public (Traefik): https://cliproxy.${DOCKER_DOMAIN}/v1
# Internal clients: http://cli-proxy-api:8317/v1
# HA (host network): http://127.0.0.1:8317/v1
# OAuth callbacks are bound to localhost on the Docker host for SSH -L tunnels.

services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TIMEZONE:-UTC}
    ports:
      # API for host-network clients (Home Assistant). Prefer Docker DNS for other services.
      - "127.0.0.1:8317:8317"
      # OAuth callbacks (Codex / Claude / Antigravity) — tunnel from your laptop:
      #   ssh -L 1455:127.0.0.1:1455 -L 54545:127.0.0.1:54545 -L 51121:127.0.0.1:51121 docker.example.invalid
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:51121:51121"
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cliproxy.tls=true"
      - "traefik.http.routers.cliproxy.entrypoints=http,https"
      # Management API/консоль — сознательно доступны в локалке за management-ключом.
      # ВНИМАНИЕ: часть эндпоинтов (напр. /v0/management/api-key-usage) отдаёт upstream-ключи
      # открытым текстом. Закрыть можно, добавив к правилу: && !PathPrefix(`/v0/management`) && !PathPrefix(`/management.html`)
      - "traefik.http.routers.cliproxy.rule=Host(`cliproxy.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.cliproxy.loadbalancer.server.port=8317"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8317'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - proxy
      - media

networks:
  proxy:
    external: true
  media:
    name: ${MEDIA_NETWORK:-media-internal}
    external: true
