services:
  lampa-ai-adapter:
    build: ./ai-adapter
    container_name: lampa-ai-adapter
    restart: unless-stopped
    depends_on:
      cli-proxy-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    pids_limit: 64
    environment:
      CLI_PROXY_BASE: http://cli-proxy-api:8317/v1
      CLI_PROXY_MODEL: gpt-6-luna
      CLI_PROXY_KEY_FILE: /run/secrets/cliproxy_api_key
      TMDB_BASE: http://lampa:9118/tmdb/api/3
      TMDB_API_KEY_FILE: /run/secrets/tmdb_api_key
      LAMPAC_FALLBACK_BASE: http://lampa:9118
    secrets:
      - cliproxy_api_key
      - tmdb_api_key
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.lampa-ai.rule=Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/ai/`)"
      - "traefik.http.routers.lampa-ai.entrypoints=http,https"
      - "traefik.http.routers.lampa-ai.tls=true"
      - "traefik.http.routers.lampa-ai.priority=100"
      - "traefik.http.routers.lampa-ai.middlewares=lampa-ai-ratelimit"
      # Lampa's built-in AI client uses the CUB-compatible route. Keep that
      # client contract at the edge, but serve it from our Luna adapter.
      - "traefik.http.routers.lampa-ai-cub.rule=Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/cub/red/api/ai/`)"
      - "traefik.http.routers.lampa-ai-cub.entrypoints=http,https"
      - "traefik.http.routers.lampa-ai-cub.tls=true"
      - "traefik.http.routers.lampa-ai-cub.priority=110"
      - "traefik.http.routers.lampa-ai-cub.middlewares=lampa-ai-cub-strip,lampa-ai-ratelimit"
      - "traefik.http.middlewares.lampa-ai-cub-strip.stripprefix.prefixes=/cub/red/api"
      - "traefik.http.middlewares.lampa-ai-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.lampa-ai-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.lampa-ai-ratelimit.ratelimit.burst=5"
      - "traefik.http.services.lampa-ai.loadbalancer.server.port=8080"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

  lampa-media:
    build: ./media
    image: homelab/lampa-media:latest
    container_name: lampa-media
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    # One thread per connection: JASSUB asks for up to 32 fonts at once, on top
    # of ffmpeg's own threads. Too low a limit leaves a run without its watcher.
    pids_limit: 256
    # Reaps ffmpeg children and stops at once on SIGTERM.
    init: true
    # Remuxing is copy-only for AAC; the cap bounds transcoding other codecs.
    cpus: 1.0
    cpu_shares: 512
    mem_limit: 256m
    environment:
      TORRSERVER_BASE: http://gluetun-torrserver:8090
      CACHE_DIR: /cache
      CACHE_MAX_MB: "2048"
      CACHE_TTL_HOURS: "72"
      FONT_LIBRARY_DIR: /fonts
    volumes:
      - ./media-cache:/cache
      # Fonts collected from releases; licensed fonts never enter git.
      - ./media-fonts:/fonts
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.lampa-media.rule=Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/homelab-media/`)"
      - "traefik.http.routers.lampa-media.entrypoints=http,https"
      - "traefik.http.routers.lampa-media.tls=true"
      - "traefik.http.routers.lampa-media.priority=100"
      - "traefik.http.routers.lampa-media.observability.accessLogs=true"
      # Player event reports: the sidecar prints them, Traefik need not.
      - "traefik.http.routers.lampa-media-log.rule=Host(`lampa.${DOCKER_DOMAIN}`) && Path(`/homelab-media/log`)"
      - "traefik.http.routers.lampa-media-log.entrypoints=http,https"
      - "traefik.http.routers.lampa-media-log.tls=true"
      - "traefik.http.routers.lampa-media-log.priority=110"
      - "traefik.http.routers.lampa-media-log.observability.accessLogs=false"
      - "traefik.http.routers.lampa-media-log.middlewares=lampa-media-log-ratelimit"
      - "traefik.http.routers.lampa-media-log.service=lampa-media"
      - "traefik.http.middlewares.lampa-media-log-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.lampa-media-log-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.lampa-media-log-ratelimit.ratelimit.burst=30"
      - "traefik.http.routers.lampa-media.service=lampa-media"
      - "traefik.http.services.lampa-media.loadbalancer.server.port=8080"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/homelab-media/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      # Traefik routes only to a healthy container: check every 2 s after a
      # start instead of leaving /homelab-media unrouted for the first minute.
      start_period: 30s
      start_interval: 2s

  lampa:
    build: ./runtime
    image: homelab/lampac-intel:latest
    container_name: lampa
    restart: unless-stopped
    cpu_shares: 2048
    depends_on:
      jacred:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    shm_size: 1024mb
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      - LIBVA_DRIVER_NAME=iHD
    labels:
      # Rebuild with --pull to update the upstream latest image and Intel runtime together.
      - "com.centurylinklabs.watchtower.enable=false"
      # Traefik stops routing to an unhealthy container; restart it instead.
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.lampa.tls=true"
      - "traefik.http.routers.lampa.entrypoints=http,https"
      - "traefik.http.routers.lampa.rule=Host(`lampa.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.lampa.middlewares=lampa-forwarded"
      - "traefik.http.routers.lampa.observability.accessLogs=true"
      - "traefik.http.middlewares.lampa-forwarded.headers.customRequestHeaders.xscheme=https"
      - "traefik.http.middlewares.lampa-forwarded.headers.customRequestHeaders.xhost=lampa.${DOCKER_DOMAIN}"
      - "traefik.http.services.lampa.loadbalancer.server.port=9118"
      # Homelab plugins are plain static files: make WebViews revalidate them (cheap 304 by ETag),
      # so a deploy reaches every TV on its next start.
      - "traefik.http.routers.lampa-plugins.rule=Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/plugins/homelab/`)"
      - "traefik.http.routers.lampa-plugins.entrypoints=http,https"
      - "traefik.http.routers.lampa-plugins.tls=true"
      - "traefik.http.routers.lampa-plugins.priority=100"
      - "traefik.http.routers.lampa-plugins.service=lampa"
      - "traefik.http.routers.lampa-plugins.middlewares=lampa-forwarded,lampa-revalidate"
      - "traefik.http.middlewares.lampa-revalidate.headers.customResponseHeaders.Cache-Control=no-cache"
      # CUB images (profile icons, reactions, backgrounds) bypass Lampac's CUB proxy: Cloudflare answers
      # the proxy's image requests with a challenge page, while clients load cub.best images directly.
      - "traefik.http.routers.lampa-cubimg.rule=Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/cub/red/img/`)"
      - "traefik.http.routers.lampa-cubimg.entrypoints=http,https"
      - "traefik.http.routers.lampa-cubimg.tls=true"
      - "traefik.http.routers.lampa-cubimg.priority=105"
      - "traefik.http.routers.lampa-cubimg.service=lampa"
      - "traefik.http.routers.lampa-cubimg.middlewares=lampa-cubimg-redirect"
      - "traefik.http.middlewares.lampa-cubimg-redirect.redirectregex.regex=^https?://[^/]+/cub/red/img/(.*)"
      - "traefik.http.middlewares.lampa-cubimg-redirect.redirectregex.replacement=https://cub.best/img/$${1}"
    volumes:
      - ./config/init.conf:/lampac/init.conf:ro
      - ./config/passwd:/lampac/passwd:ro
      - ./config/lampainit-invc.js:/lampac/module/LampaWeb/plugins/lampainit-invc.js:ro
      - ./plugins:/lampac/wwwroot/plugins/homelab:ro
      - ./mods/Tracks:/lampac/mods/Tracks:ro
      - ./mods/HomelabSync:/lampac/mods/HomelabSync:ro
      - ./cache:/lampac/cache
      - ./database:/lampac/database
      - ./logs:/lampac/logs
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # DeUnhealth restarts Lampa once this fails: allow slow answers under
      # transcoding load, so only a hang of about 2.5 minutes restarts it.
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "10", "http://127.0.0.1:9118/version?type=hash"]
      interval: 30s
      timeout: 12s
      retries: 5
      # A new version's first start compiles every module (about 5 minutes);
      # failures before the first success do not count toward retries.
      start_period: 600s
    networks:
      - proxy
      - jacred

networks:
  proxy:
    external: true
  jacred:
    name: jacred
    external: true

secrets:
  cliproxy_api_key:
    file: ../hermes/secrets/cliproxy_api_key
  tmdb_api_key:
    file: ../hermes/secrets/tmdb_api_key
