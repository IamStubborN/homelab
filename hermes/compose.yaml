name: hermes

x-watchtower: &watchtower
  com.centurylinklabs.watchtower.enable: "true"

x-hermes-common: &hermes-common
  image: nousresearch/hermes-agent@sha256:1eafbbd7357ef92265ab2ba3e11edd0ff550b36bd7a1643ca88a142d5a4d4f8f
  entrypoint: [/usr/local/bin/hermes-home-entrypoint]
  command: [gateway, run]
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  security_opt: [no-new-privileges:true]
  pids_limit: 512
  shm_size: 1gb
  tmpfs:
    - /run:rw,exec,nosuid,nodev,size=32m
    - /tmp:rw,nosuid,nodev,noexec,size=256m
  labels:
    com.centurylinklabs.watchtower.enable: "false"
  extra_hosts:
    - api.telegram.org=149.154.167.220
  environment:
    AGENT_BROWSER_CONTENT_BOUNDARIES: "1"
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: 127.0.0.1
    API_SERVER_PORT: "8642"
    HERMES_GATEWAY_BOOTSTRAP_STATE: running
    HERMES_GID: "10000"
    HERMES_DISABLE_LAZY_INSTALLS: "1"
    HERMES_UID: "10000"
    HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
    HERMES_TELEGRAM_USE_DEFAULT_HTTP: "false"
    TMPDIR: /opt/data/tmp
    TMP: /opt/data/tmp
    TEMP: /opt/data/tmp
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 60s
  networks: [media, agent-tools]

x-notifier-common: &notifier-common
  image: python:latest
  command: [/usr/local/bin/media-notifier]
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  group_add: ["1000"]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m"]
  expose: ["8644"]
  labels: *watchtower
  environment:
    LISTEN_ADDR: 0.0.0.0:8644
    PYTHONPATH: /usr/local/lib/hermes-home
    STATE_DIR: /data
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8644/health', timeout=3).read()"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  networks: [media, agent-tools]
  volumes:
    - ./scripts/media-notifier:/usr/local/bin/media-notifier:ro
    - ./scripts/hermes_media_notifications.py:/usr/local/lib/hermes-home/hermes_media_notifications.py:ro
    - ./shared/plugins/telegram-home/assets/media-menu.jpg:/usr/local/share/hermes-home/media-menu.jpg:ro

services:
  agent-browser-updater:
    image: node:latest
    container_name: agent-browser-updater
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        while true; do
          npm install --prefix /opt/tools agent-browser@latest &&
          touch /opt/tools/.ready;
          sleep 86400;
        done
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels: *watchtower
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m"]
    volumes:
      - agent_browser_tools:/opt/tools
    healthcheck:
      test: [CMD, test, -x, /opt/tools/node_modules/.bin/agent-browser]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [agent-tools]

  vaultwarden-init-primary:
    image: python:latest
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        chown -R 10000:10000 /opt/data/vaultwarden /opt/tools &&
        chmod 0700 /opt/data/vaultwarden
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    labels: *watchtower
    volumes:
      - hermes_primary_vaultwarden:/opt/data/vaultwarden
      - vaultwarden_tools:/opt/tools
    networks: [none]

  vaultwarden-broker-primary:
    image: python:latest
    container_name: vaultwarden-broker-primary
    entrypoint: [/usr/local/bin/vaultwarden-broker-entrypoint]
    user: "10000:10000"
    group_add: ["1000"]
    depends_on:
      vaultwarden-init-primary:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels: *watchtower
    environment:
      BITWARDENCLI_APPDATA_DIR: /opt/data/vaultwarden
      BW_PATH: /opt/tools/bw
      HOME: /opt/data/vaultwarden
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=128m"]
    volumes:
      - hermes_primary_vaultwarden:/opt/data/vaultwarden
      - vaultwarden_tools:/opt/tools
      - ./scripts/vaultwarden-broker-entrypoint:/usr/local/bin/vaultwarden-broker-entrypoint:ro
      - ./scripts/install_bitwarden_cli.py:/usr/local/bin/install-bitwarden-cli:ro
      - ./scripts/vaultwarden_broker.py:/usr/local/bin/vaultwarden-broker:ro
      - ./config/vaultwarden-server:/etc/hermes-home/vaultwarden-server:ro
      - ./config/vaultwarden-login-allowlist.json:/etc/hermes-home/vaultwarden-login-allowlist.json:ro
    secrets:
      - source: primary_vaultwarden_session
        target: vaultwarden_session
      - source: primary_vaultwarden_broker_token
        target: broker_api_token
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [primary-private]

  media-notifier-primary:
    <<: *notifier-common
    container_name: media-notifier-primary
    environment:
      LISTEN_ADDR: 0.0.0.0:8644
      PYTHONPATH: /usr/local/lib/hermes-home
      STATE_DIR: /data
      TELEGRAM_CHAT_ID: ${PRIMARY_TELEGRAM_CHAT_ID:?set PRIMARY_TELEGRAM_CHAT_ID}
    volumes:
      - ./scripts/media-notifier:/usr/local/bin/media-notifier:ro
      - ./scripts/hermes_media_notifications.py:/usr/local/lib/hermes-home/hermes_media_notifications.py:ro
      - ./shared/plugins/telegram-home/assets/media-menu.jpg:/usr/local/share/hermes-home/media-menu.jpg:ro
      - media_notifier_primary:/data
    secrets:
      - source: primary_telegram_token
        target: telegram_bot_token
      - source: primary_webhook_hmac
        target: webhook_hmac

  media-notifier-secondary:
    <<: *notifier-common
    container_name: media-notifier-secondary
    environment:
      LISTEN_ADDR: 0.0.0.0:8644
      PYTHONPATH: /usr/local/lib/hermes-home
      STATE_DIR: /data
      TELEGRAM_CHAT_ID: ${SECONDARY_TELEGRAM_CHAT_ID:?set SECONDARY_TELEGRAM_CHAT_ID}
    volumes:
      - ./scripts/media-notifier:/usr/local/bin/media-notifier:ro
      - ./scripts/hermes_media_notifications.py:/usr/local/lib/hermes-home/hermes_media_notifications.py:ro
      - ./shared/plugins/telegram-home/assets/media-menu.jpg:/usr/local/share/hermes-home/media-menu.jpg:ro
      - media_notifier_secondary:/data
    secrets:
      - source: secondary_telegram_token
        target: telegram_bot_token
      - source: secondary_webhook_hmac
        target: webhook_hmac

  hermes-primary:
    <<: *hermes-common
    container_name: hermes-primary
    depends_on:
      agent-browser-updater:
        condition: service_healthy
      media-notifier-primary:
        condition: service_healthy
      vaultwarden-broker-primary:
        condition: service_healthy
    environment:
      AGENT_BROWSER_ARGS: --disable-blink-features=AutomationControlled
      AGENT_BROWSER_CONTENT_BOUNDARIES: "1"
      AGENT_BROWSER_PLUGINS: >-
        [{"name":"vaultwarden","command":"/usr/local/bin/agent-browser-plugin-vaultwarden","capabilities":["credential.read"]}]
      AGENT_BROWSER_RESTORE: primary
      AGENT_BROWSER_USER_AGENT: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_PORT: "8642"
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      HERMES_GID: "10000"
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_UID: "10000"
      HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
      HERMES_TELEGRAM_USE_DEFAULT_HTTP: "false"
      TMPDIR: /opt/data/tmp
      TMP: /opt/data/tmp
      TEMP: /opt/data/tmp
      HEALTH_DEFAULT_PERSON: primary
      HEALTH_MCP_URL: http://health-service:8080/internal/mcp
      WIKI_PATH: /wiki
      MEDIA_NOTIFIER_CONTROL_URL: http://media-notifier-primary:8644
      TELEGRAM_ALLOWED_USERS: ${PRIMARY_TELEGRAM_USER_ID:?set PRIMARY_TELEGRAM_USER_ID}
      TELEGRAM_HOME_CHANNEL: ${PRIMARY_TELEGRAM_CHAT_ID:?set PRIMARY_TELEGRAM_CHAT_ID}
      WEBHOOK_SECRET_FILE: /run/hermes-home-secrets/webhook_hmac
    volumes:
      - hermes_primary_profile:/opt/data
      - hermes_primary_memory:/opt/data/memories
      - hermes_primary_browser:/opt/data/browser_auth
      - agent_browser_tools:/opt/tools:ro
      - ./scripts/hermes-home-entrypoint:/usr/local/bin/hermes-home-entrypoint:ro
      - ./scripts/merge_hermes_config.py:/usr/local/bin/merge-hermes-config:ro
      - ./scripts/hermes-mcp-schema-revision:/usr/local/bin/hermes-mcp-schema-revision:ro
      - ./scripts/vaultwarden-safe:/usr/local/bin/vaultwarden-safe:ro
      - ./scripts/agent-browser:/usr/local/bin/agent-browser:ro
      - ./scripts/agent_browser_plugin_vaultwarden.py:/usr/local/bin/agent-browser-plugin-vaultwarden:ro
      - ./profiles/primary/config/config.yaml:/etc/hermes-home/config.yaml:ro
      - ./profiles/primary/SOUL.md:/etc/hermes-home/SOUL.md:ro
      - ./profiles/primary/identity:/etc/hermes-home/profile-id:ro
      - ./config/media-service-url:/etc/hermes-home/media-service-url:ro
      - ./config/vaultwarden-server:/etc/hermes-home/vaultwarden-server:ro
      - ./shared/skills:/etc/hermes-home/skills:ro
      - ./shared/plugins:/etc/hermes-home/shared-plugins:ro
      - ./profiles/primary/skills:/etc/hermes-home/personal-skills:ro
      - ./profiles/primary/plugins:/etc/hermes-home/personal-plugins:ro
      # Personal llm-wiki root. Host shared/ is an explicit nested bind (not a
      # copy) so /wiki/shared is the family tree. Bundled obsidian skill stays
      # disabled; official Sync is a separate host service — no OBSIDIAN_VAULT_PATH.
      - ${WIKI_ROOT:-/mnt/internal/wiki}/primary:/wiki
      - ${WIKI_ROOT:-/mnt/internal/wiki}/shared:/wiki/shared
    secrets:
      - source: primary_telegram_token
        target: telegram_bot_token
      - source: primary_media_api_token
        target: media_api_token
      - source: primary_health_api_token
        target: health_api_token
      - source: primary_homeassistant_token
        target: homeassistant_api_token
      - source: primary_omniroute_api_key
        target: omniroute_api_key
      - source: primary_groq_api_key
        target: groq_api_key
      - source: primary_vaultwarden_broker_token
        target: broker_api_token
      - source: primary_webhook_hmac
        target: webhook_hmac
      - source: search_ladder_api_key
        target: search_ladder_api_key
    networks: [media, agent-tools, health-internal, primary-private]

  hermes-secondary:
    <<: *hermes-common
    container_name: hermes-secondary
    depends_on:
      agent-browser-updater:
        condition: service_healthy
      media-notifier-secondary:
        condition: service_healthy
    environment:
      AGENT_BROWSER_CONTENT_BOUNDARIES: "1"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_PORT: "8642"
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      HERMES_GID: "10000"
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_UID: "10000"
      HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
      HERMES_TELEGRAM_USE_DEFAULT_HTTP: "false"
      TMPDIR: /opt/data/tmp
      TMP: /opt/data/tmp
      TEMP: /opt/data/tmp
      HEALTH_DEFAULT_PERSON: secondary
      HEALTH_MCP_URL: http://health-service:8080/internal/mcp
      WIKI_PATH: /wiki
      MEDIA_NOTIFIER_CONTROL_URL: http://media-notifier-secondary:8644
      TELEGRAM_ALLOWED_USERS: ${SECONDARY_TELEGRAM_USER_ID:?set SECONDARY_TELEGRAM_USER_ID}
      TELEGRAM_HOME_CHANNEL: ${SECONDARY_TELEGRAM_CHAT_ID:?set SECONDARY_TELEGRAM_CHAT_ID}
      WEBHOOK_SECRET_FILE: /run/hermes-home-secrets/webhook_hmac
    volumes:
      - hermes_secondary_profile:/opt/data
      - hermes_secondary_memory:/opt/data/memories
      - hermes_secondary_browser:/opt/data/browser_auth
      - agent_browser_tools:/opt/tools:ro
      - ./scripts/hermes-home-entrypoint:/usr/local/bin/hermes-home-entrypoint:ro
      - ./scripts/merge_hermes_config.py:/usr/local/bin/merge-hermes-config:ro
      - ./scripts/hermes-mcp-schema-revision:/usr/local/bin/hermes-mcp-schema-revision:ro
      - ./scripts/agent-browser:/usr/local/bin/agent-browser:ro
      - ./profiles/secondary/config/config.yaml:/etc/hermes-home/config.yaml:ro
      - ./profiles/secondary/SOUL.md:/etc/hermes-home/SOUL.md:ro
      - ./profiles/secondary/identity:/etc/hermes-home/profile-id:ro
      - ./config/media-service-url:/etc/hermes-home/media-service-url:ro
      - ./shared/skills:/etc/hermes-home/skills:ro
      - ./shared/plugins:/etc/hermes-home/shared-plugins:ro
      - ./profiles/secondary/skills:/etc/hermes-home/personal-skills:ro
      - ./profiles/secondary/plugins:/etc/hermes-home/personal-plugins:ro
      # Personal llm-wiki root + nested family shared bind (same layout as Primary).
      - ${WIKI_ROOT:-/mnt/internal/wiki}/secondary:/wiki
      - ${WIKI_ROOT:-/mnt/internal/wiki}/shared:/wiki/shared
    secrets:
      - source: secondary_telegram_token
        target: telegram_bot_token
      - source: secondary_media_api_token
        target: media_api_token
      - source: secondary_health_api_token
        target: health_api_token
      - source: secondary_homeassistant_token
        target: homeassistant_api_token
      - source: secondary_omniroute_api_key
        target: omniroute_api_key
      - source: secondary_groq_api_key
        target: groq_api_key
      - source: secondary_webhook_hmac
        target: webhook_hmac
      - source: search_ladder_api_key
        target: search_ladder_api_key
    networks: [media, agent-tools, health-internal, secondary-private]

networks:
  media:
    name: ${MEDIA_NETWORK:-media-internal}
    external: true
  agent-tools:
    name: agent-tools
  health-internal:
    name: health-internal
    external: true
  primary-private:
    name: homelab_primary-private
  secondary-private:
    name: homelab_secondary-private
  none:
    name: homelab_none
    internal: true

volumes:
  agent_browser_tools:
    name: homelab_agent_browser_tools
  hermes_primary_profile:
    name: homelab_hermes_primary_profile
  hermes_primary_memory:
    name: homelab_hermes_primary_memory
  hermes_primary_browser:
    name: homelab_hermes_primary_browser
  hermes_primary_vaultwarden:
    name: homelab_hermes_primary_vaultwarden
  hermes_secondary_profile:
    name: homelab_hermes_secondary_profile
  hermes_secondary_memory:
    name: homelab_hermes_secondary_memory
  hermes_secondary_browser:
    name: homelab_hermes_secondary_browser
  media_notifier_primary:
    name: homelab_media_notifier_primary
  media_notifier_secondary:
    name: homelab_media_notifier_secondary
  vaultwarden_tools:
    name: homelab_vaultwarden_tools

secrets:
  primary_telegram_token:
    file: ./secrets/primary.telegram_token
  primary_media_api_token:
    file: ./secrets/primary.media_api_token
  primary_health_api_token:
    file: ../health/secrets/primary.health_api_token
  primary_homeassistant_token:
    file: ./secrets/primary.homeassistant_token
  primary_omniroute_api_key:
    file: ./secrets/primary.omniroute_api_key
  primary_groq_api_key:
    file: ./secrets/primary.groq_api_key
  primary_webhook_hmac:
    file: ./secrets/primary.webhook_hmac
  primary_vaultwarden_session:
    file: ./secrets/primary.vaultwarden_session
  primary_vaultwarden_broker_token:
    file: ./secrets/primary.vaultwarden_broker_token
  secondary_telegram_token:
    file: ./secrets/secondary.telegram_token
  secondary_media_api_token:
    file: ./secrets/secondary.media_api_token
  secondary_health_api_token:
    file: ../health/secrets/secondary.health_api_token
  secondary_homeassistant_token:
    file: ./secrets/secondary.homeassistant_token
  secondary_omniroute_api_key:
    file: ./secrets/secondary.omniroute_api_key
  secondary_groq_api_key:
    file: ./secrets/secondary.groq_api_key
  secondary_webhook_hmac:
    file: ./secrets/secondary.webhook_hmac
  search_ladder_api_key:
    file: ./secrets/search_ladder.api_key
