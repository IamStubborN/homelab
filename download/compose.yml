services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      # Gluetun state lives next to this compose file, not under media/.
      - ./gluetun/data:/gluetun
      - ./gluetun/scripts:/scripts:ro
    healthcheck:
      test: [ "CMD-SHELL", "/scripts/healthcheck.sh" ]
      interval: 20s
      timeout: 15s
      retries: 2
      start_period: 60s
    environment:
      - TZ=${TIMEZONE:-UTC}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - PORT_FORWARD_ONLY=on
      - SERVER_COUNTRIES=Bulgaria
      - WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/protonvpn_wireguard_private_key
      - DNS_SERVER=on
      - DNS_UPSTREAM_RESOLVERS=cloudflare,google
      - BLOCK_MALICIOUS=off
      - DNS_UPSTREAM_IPV6=off
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/run/secrets/gluetun_control_auth_config
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port
    secrets:
      - protonvpn_wireguard_private_key
      - gluetun_control_auth_config
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.entrypoints=http,https"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8400"
      - "traefik.http.routers.speedtest-vpn.tls=true"
      - "traefik.http.routers.speedtest-vpn.entrypoints=http,https"
      - "traefik.http.routers.speedtest-vpn.service=speedtest-vpn"
      - "traefik.http.routers.speedtest-vpn.rule=Host(`speedtest-vpn.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.speedtest-vpn.loadbalancer.server.port=80"
      - "deunhealth.restart.on.unhealthy=true"
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

  qbittorrent:
    container_name: qbittorrent
    image: linuxserver/qbittorrent:latest
    network_mode: 'service:gluetun'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [ "CMD-SHELL", "/scripts/healthcheck.sh" ]
      interval: 20s
      timeout: 15s
      retries: 2
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "deunhealth.restart.on.unhealthy=true"
    environment:
      - PUID=1000
      - PGID=1000
      - UNMASK=002
      - TZ=${TIMEZONE:-UTC}
      - WEBUI_PORT=8400
    secrets:
      - gluetun_control_api_key
    volumes:
      - ./qbittorrent/config:/config
      - ./qbittorrent/ui:/ui
      - ./qbittorrent/scripts:/scripts
      - ./gluetun/data/forwarded_port:/gluetun/forwarded_port:ro
      - /etc/localtime:/etc/localtime:ro
      - ${INTERNAL_STORAGE:-/mnt/internal}/torrents:/data/internal/torrents
      - ${USB_STORAGE:-/mnt/usb_drive}/torrents:/data/usb_drive/torrents

  gluetun-torrserver:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-torrserver
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./gluetun-torrserver/data:/gluetun
      - ./gluetun/scripts:/scripts:ro
    healthcheck:
      test: [ "CMD-SHELL", "/scripts/healthcheck.sh" ]
      interval: 20s
      timeout: 15s
      retries: 2
      start_period: 60s
    environment:
      - TZ=${TIMEZONE:-UTC}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - PORT_FORWARD_ONLY=on
      - SERVER_COUNTRIES=Bulgaria
      - WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/protonvpn_wireguard_private_key_torrserver
      - DNS_SERVER=on
      - DNS_UPSTREAM_RESOLVERS=cloudflare,google
      # Allow TorrServer's shared VPN namespace to reach Traefik on the LAN.
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET:-192.0.2.17/24}
      - BLOCK_MALICIOUS=off
      - DNS_UPSTREAM_IPV6=off
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/run/secrets/gluetun_control_auth_config
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port
    secrets:
      - protonvpn_wireguard_private_key_torrserver
      - gluetun_control_auth_config
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.torrserver.tls=true"
      - "traefik.http.routers.torrserver.entrypoints=https"
      - "traefik.http.routers.torrserver.service=torrserver"
      - "traefik.http.routers.torrserver.rule=Host(`torrserver.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.torrserver-http.entrypoints=http"
      - "traefik.http.routers.torrserver-http.service=torrserver"
      - "traefik.http.routers.torrserver-http.rule=Host(`torrserver.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.torrserver-http.priority=100"
      - "traefik.http.routers.lampa-torrserver.tls=true"
      - "traefik.http.routers.lampa-torrserver.entrypoints=https"
      - "traefik.http.routers.lampa-torrserver.service=torrserver"
      - "traefik.http.routers.lampa-torrserver.rule=Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/torrserver`)"
      - "traefik.http.routers.lampa-torrserver.priority=100"
      - "traefik.http.routers.lampa-torrserver.middlewares=lampa-torrserver-strip"
      - "traefik.http.middlewares.lampa-torrserver-strip.stripprefix.prefixes=/torrserver"
      # TorrServer's HLS playlists use root-relative /gst/* segment URLs.
      # Keep this second route unstripped so those browser requests resolve.
      - "traefik.http.routers.lampa-torrserver-gst.tls=true"
      - "traefik.http.routers.lampa-torrserver-gst.entrypoints=https"
      - "traefik.http.routers.lampa-torrserver-gst.service=torrserver"
      - "traefik.http.routers.lampa-torrserver-gst.rule=Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/gst`)"
      - "traefik.http.routers.lampa-torrserver-gst.priority=101"
      - "traefik.http.services.torrserver.loadbalancer.server.port=8090"
      - "deunhealth.restart.on.unhealthy=true"
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

  torrserver:
    container_name: torrserver
    build:
      context: ./torrserver
      args:
        TORRSERVER_VERSION: MatriX.145
    image: homelab/torrserver-gst:MatriX.145
    network_mode: 'service:gluetun-torrserver'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      gluetun-torrserver:
        condition: service_healthy
        restart: true
    environment:
      - TS_PORT=8090
      - TS_DONTKILL=1
      - TS_HTTPAUTH=0
      - TS_CONF_PATH=/opt/ts/config
      - LIBVA_DRIVER_NAME=iHD
    # The custom image executes the TorrServer binary directly, so pass the
    # paths explicitly instead of relying on TS_* variables that the binary
    # itself does not parse.
    command:
      - --path
      - /opt/ts/config
      - --logpath
      - /opt/ts/log/torrserver.log
      - --port
      - "8090"
      - --torrentsdir
      - /opt/ts/torrents
      - --dontkill
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ./torrserver/config:/opt/ts/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/echo >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "deunhealth.restart.on.unhealthy=true"

  torrserver-port-sync:
    image: alpine:3.23
    container_name: torrserver-port-sync
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      gluetun-torrserver:
        condition: service_healthy
      torrserver:
        condition: service_started
    environment:
      - TORRSERVER_URL=http://gluetun-torrserver:8090
      - FORWARDED_PORT_FILE=/gluetun/forwarded_port
      - SYNC_STATE_FILE=/tmp/synced_port
      - POLL_INTERVAL=5
    volumes:
      - ./torrserver-port-sync.sh:/scripts/port-sync.sh:ro
      - ./gluetun-torrserver/data/forwarded_port:/gluetun/forwarded_port:ro
    tmpfs:
      - /tmp:size=1m,mode=1777
    entrypoint: ["sh", "/scripts/port-sync.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/synced_port && test \"$$(cat /tmp/synced_port)\" = \"$$(tr -dc '0-9' < /gluetun/forwarded_port)\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - proxy

  qbittorrent-port-sync:
    image: alpine:3.23
    container_name: qbittorrent-port-sync
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    environment:
      - QBITTORRENT_URL=http://gluetun:8400
      - FORWARDED_PORT_FILE=/gluetun/forwarded_port
      - SYNC_STATE_FILE=/tmp/synced_port
      - POLL_INTERVAL=5
    volumes:
      - ./qbittorrent/scripts/port-sync.sh:/scripts/port-sync.sh:ro
      - ./gluetun/data/forwarded_port:/gluetun/forwarded_port:ro
    tmpfs:
      - /tmp:size=1m,mode=1777
    entrypoint: ["sh", "/scripts/port-sync.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/synced_port && test \"$$(cat /tmp/synced_port)\" = \"$$(tr -dc '0-9' < /gluetun/forwarded_port)\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - proxy

  prowlarr:
    container_name: prowlarr
    image: linuxserver/prowlarr:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - UNMASK=002
      - TZ=${TIMEZONE:-UTC}
      - DOTNET_SYSTEM_NET_DISABLEIPV6=1
    healthcheck:
      test: "curl -sf http://localhost:9696/ping || exit 1"
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr-direct.tls=true"
      - "traefik.http.routers.prowlarr-direct.entrypoints=http,https"
      - "traefik.http.routers.prowlarr-direct.service=prowlarr-direct"
      - "traefik.http.routers.prowlarr-direct.priority=100"
      - "traefik.http.routers.prowlarr-direct.rule=Host(`prowlarr.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.lampa-prowlarr.tls=true"
      - "traefik.http.routers.lampa-prowlarr.entrypoints=https"
      - "traefik.http.routers.lampa-prowlarr.service=prowlarr-lampa"
      - "traefik.http.routers.lampa-prowlarr.rule=Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/prowlarr`)"
      - "traefik.http.routers.lampa-prowlarr.priority=100"
      - "traefik.http.routers.lampa-prowlarr.middlewares=lampa-prowlarr-strip"
      - "traefik.http.middlewares.lampa-prowlarr-strip.stripprefix.prefixes=/prowlarr"
      # TorrServer uses Docker DNS and reaches Traefik directly; the public
      # Lampa FQDN remains the browser-facing interface above.
      - "traefik.http.routers.lampa-prowlarr-internal.entrypoints=http"
      - "traefik.http.routers.lampa-prowlarr-internal.service=prowlarr-lampa"
      - "traefik.http.routers.lampa-prowlarr-internal.rule=Host(`traefik`) && PathPrefix(`/prowlarr`)"
      - "traefik.http.routers.lampa-prowlarr-internal.priority=120"
      - "traefik.http.routers.lampa-prowlarr-internal.middlewares=lampa-prowlarr-internal-strip"
      - "traefik.http.middlewares.lampa-prowlarr-internal-strip.stripprefix.prefixes=/prowlarr"
      - "traefik.http.services.prowlarr-direct.loadbalancer.server.port=9696"
      - "traefik.http.services.prowlarr-lampa.loadbalancer.server.port=9696"
    volumes:
      - ./prowlarr/config:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy

  # Solverr exposes the FlareSolverr-compatible /v1 API and adds a stealth
  # browser fallback for protected trackers.
  solverr:
    container_name: solverr
    image: ghcr.io/unseensnick/solverr:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - LOG_LEVEL=info
      - TZ=${TIMEZONE:-UTC}
      - BROWSER_LOCALE=en-US
      - MAX_TIMEOUT_MS=300000
    expose:
      - "8191"
    shm_size: 512mb
    mem_limit: 2g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=false"
    networks:
      - proxy

  # Dedicated browser pool for JacRed crawl/ParseAll work.
  solverr-crawl:
    container_name: solverr-crawl
    image: ghcr.io/unseensnick/solverr:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - LOG_LEVEL=info
      - TZ=${TIMEZONE:-UTC}
      - BROWSER_LOCALE=en-US
      - MAX_TIMEOUT_MS=300000
    expose:
      - "8191"
    shm_size: 512mb
    mem_limit: 2g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=false"
    networks:
      - proxy

  gluetun-watcher:
    image: docker:cli
    container_name: gluetun-watcher
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PARENT_CONTAINER=gluetun
      - DEPENDENT_CONTAINERS=qbittorrent speedtest-tracker-vpn
      - HEALTH_TIMEOUT=120
      - SETTLE_DELAY=10
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gluetun-watcher/watch.sh:/watch.sh:ro
      - ${HOMELAB_ROOT:-/opt/homelab}:${HOMELAB_ROOT:-/opt/homelab}:ro
    entrypoint: ["sh", "/watch.sh"]
    healthcheck:
      test: [CMD, pgrep, -f, "docker events.*container="]
      interval: 30s
      timeout: 5s
      retries: 3

  gluetun-torrserver-watcher:
    image: docker:cli
    container_name: gluetun-torrserver-watcher
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      gluetun-torrserver:
        condition: service_healthy
    environment:
      - PARENT_CONTAINER=gluetun-torrserver
      - DEPENDENT_CONTAINERS=torrserver
      - HEALTH_TIMEOUT=120
      - SETTLE_DELAY=10
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gluetun-watcher/watch.sh:/watch.sh:ro
      - ${HOMELAB_ROOT:-/opt/homelab}:${HOMELAB_ROOT:-/opt/homelab}:ro
    entrypoint: ["sh", "/watch.sh"]
    healthcheck:
      test: [CMD, pgrep, -f, "docker events.*container="]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  protonvpn_wireguard_private_key:
    file: ./secrets/protonvpn_wireguard_private_key
  protonvpn_wireguard_private_key_torrserver:
    file: ./secrets/protonvpn_wireguard_private_key_torrserver
  gluetun_control_auth_config:
    file: ./secrets/gluetun_control_auth_config
  gluetun_control_api_key:
    file: ./secrets/gluetun_control_api_key

networks:
  proxy:
    external: true
