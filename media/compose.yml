services:
  qbittorrent:
    container_name: qbittorrent
    hostname: qbittorrent.internal
    image: ghcr.io/hotio/qbittorrent:release@sha256:fbff489ebe410ad4be3e86294298f40ccefb2cb410ccf2847f7c5819171dfb56
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.rp_filter=2
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8400/ >/dev/null && ip link show wg0 | grep -q 'UP'"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.entrypoints=http,https"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8400"
      - "traefik.http.routers.speedtest-vpn.tls=true"
      - "traefik.http.routers.speedtest-vpn.entrypoints=http,https"
      - "traefik.http.routers.speedtest-vpn.service=speedtest-vpn"
      - "traefik.http.routers.speedtest-vpn.rule=Host(`speedtest-vpn.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.speedtest-vpn.loadbalancer.server.port=80"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=${TIMEZONE:-UTC}
      - WEBUI_PORTS=8400/tcp
      - LIBTORRENT=v2
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=proton
      - VPN_LAN_NETWORK=
      - VPN_LAN_LEAK_ENABLED=false
      - VPN_EXPOSE_PORTS_ON_LAN=80/tcp
      - VPN_AUTO_PORT_FORWARD=true
      - VPN_PORT_REDIRECTS=
      - VPN_HEALTHCHECK_ENABLED=true
      - VPN_NAMESERVERS=wg
      - VPN_INTERFACE_PREFIXES=eth,enp
      - PRIVOXY_ENABLED=false
      - UNBOUND_ENABLED=false
    volumes:
      - ./qbittorrent/config:/config
      - ./qbittorrent/ui:/ui
      - /etc/localtime:/etc/localtime:ro
      - ${INTERNAL_STORAGE:-/mnt/internal}/torrents:/data/internal/torrents
      - ${USB_STORAGE:-/mnt/usb_drive}/torrents:/data/usb_drive/torrents
    networks:
      - proxy

  prowlarr:
    container_name: prowlarr
    image: linuxserver/prowlarr:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - UNMASK=002
      - TZ=${TIMEZONE:-UTC}
      - DOTNET_SYSTEM_NET_DISABLEIPV6=1
    healthcheck:
      test: "curl -sf http://localhost:9696/ping || exit 1"
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=true"
      # A distinct router/service name prevents a stale pre-migration Gluetun
      # container from joining this load-balancer until its next safe restart.
      - "traefik.http.routers.prowlarr-direct.tls=true"
      - "traefik.http.routers.prowlarr-direct.entrypoints=http,https"
      - "traefik.http.routers.prowlarr-direct.service=prowlarr-direct"
      - "traefik.http.routers.prowlarr-direct.priority=100"
      - "traefik.http.routers.prowlarr-direct.rule=Host(`prowlarr.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.prowlarr-direct.loadbalancer.server.port=9696"
    volumes:
      - ./prowlarr/config:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # INFO logs include request bodies and can expose private-indexer credentials.
      - LOG_LEVEL=warning
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TIMEZONE:-UTC}
    expose:
      - "8191"
    shm_size: 512mb
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=false"
    networks:
      - proxy

  vpn-namespace-watcher:
    image: docker:cli
    container_name: vpn-namespace-watcher
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      qbittorrent:
        condition: service_healthy
    environment:
      - PARENT_CONTAINER=qbittorrent
      - DEPENDENT_CONTAINERS=speedtest-tracker-vpn
      - HEALTH_TIMEOUT=120
      - SETTLE_DELAY=10
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./vpn-namespace-watcher/watch.sh:/watch.sh:ro
      - ${HOMELAB_ROOT:-/opt/homelab}:${HOMELAB_ROOT:-/opt/homelab}:ro
    entrypoint: ["sh", "/watch.sh"]

  plex-orphan-watcher:
    image: ${PLEX_ORPHAN_WATCHER_IMAGE:-ghcr.io/iamstubborn/plex-orphan-watcher:0.4.4@sha256:b7e418b81c62301447aae609a9017f59c511594bbf5c3dac6e70a6c6b02c8f2a}
    container_name: plex-orphan-watcher
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      plex:
        condition: service_healthy
    environment:
      - PLEX_URL=http://plex:32400
      - PLEX_TOKEN_FILE=/run/secrets/plex_token
      - DELETE_ROOTS=/data/internal/media,/data/usb_drive/media
      - AUDIT_ROOTS=/data/internal/torrents,/data/usb_drive/torrents
      - STATE_PATH=/state/watcher.db
      - DRY_RUN=false
      - SETTLE_DELAY=15m
      - RECONCILE_INTERVAL=1h
      - HEALTH_ADDRESS=:8080
    volumes:
      - ./plex-orphan-watcher/state:/state
      - ${INTERNAL_STORAGE:-/mnt/internal}/media:/data/internal/media
      - ${USB_STORAGE:-/mnt/usb_drive}/media:/data/usb_drive/media
      - ${INTERNAL_STORAGE:-/mnt/internal}/torrents:/data/internal/torrents:ro
      - ${USB_STORAGE:-/mnt/usb_drive}/torrents:/data/usb_drive/torrents:ro
    secrets:
      - plex_token
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "deunhealth.restart.on.unhealthy=true"
    networks:
      - proxy

  plex:
    image: linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 32400:32400
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - TZ=${TIMEZONE:-UTC}
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./plex/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /dev/shm:/transcode
      - ${INTERNAL_STORAGE:-/mnt/internal}:/data/internal
      - ${USB_STORAGE:-/mnt/usb_drive}:/data/usb_drive
    healthcheck:
      test: "curl -sf http://localhost:32400/identity || exit 1"
      interval: 1m
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=true"
      - "traefik.http.routers.plex.tls=true"
      - "traefik.http.routers.plex.entrypoints=http,https"
      - "traefik.http.routers.plex.service=plex"
      - "traefik.http.routers.plex.rule=Host(`plex.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
    networks:
      - proxy


  plex-auto-languages:
    image: ghcr.io/journeydocker/plex-auto-languages:latest
    container_name: plex-auto-languages
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PLEX_URL=http://plex:32400
      - PLEX_TOKEN_FILE=/run/secrets/plex_token
      - TZ=${TIMEZONE:-UTC}
      - UPDATE_LEVEL=show
      - UPDATE_STRATEGY=all
      - TRIGGER_ON_PLAY=true
      - TRIGGER_ON_SCAN=false
      - SCHEDULER_ENABLE=false
      - DEBUG=true
    volumes:
      - ./plex-auto-languages/config:/config
      - ./plex-auto-languages/logs:/logs
    secrets:
      - plex_token
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    networks:
      - proxy


  media-preview-generator:
    image: stevezzau/media_preview_generator:latest
    container_name: media-preview-generator
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      plex:
        condition: service_healthy
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - ./media-preview-generator/config:/config
      - ./plex/config:/plex:rw
      - /etc/localtime:/etc/localtime:ro
      - ${INTERNAL_STORAGE:-/mnt/internal}:/data/internal:ro
      - ${USB_STORAGE:-/mnt/usb_drive}:/data/usb_drive:ro
    healthcheck:
      test: "curl -sf http://localhost:8080/api/health || curl -sf http://localhost:8080/api/system/status || exit 1"
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "deunhealth.restart.on.unhealthy=true"
      - "traefik.enable=true"
      - "traefik.http.routers.media-preview.tls=true"
      - "traefik.http.routers.media-preview.entrypoints=http,https"
      - "traefik.http.routers.media-preview.service=media-preview"
      - "traefik.http.routers.media-preview.rule=Host(`media-preview.${DOCKER_DOMAIN}`)"
      - "traefik.http.services.media-preview.loadbalancer.server.port=8080"
    networks:
      - proxy

secrets:
  plex_token:
    file: ./secrets/plex_token

networks:
  proxy:
    external: true
