services:
  omniroute-redis:
    image: redis:8-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - omniroute_redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - web-research-backend

  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      omniroute-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "20128"
      API_PORT: "20129"
      HOSTNAME: 0.0.0.0
      API_HOST: 0.0.0.0
      DATA_DIR: /app/data
      REDIS_URL: redis://omniroute-redis:6379
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:?set OMNIROUTE_JWT_SECRET}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:?set OMNIROUTE_API_KEY_SECRET}
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY:?set OMNIROUTE_STORAGE_ENCRYPTION_KEY}
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?set OMNIROUTE_INITIAL_PASSWORD}
      REQUIRE_API_KEY: "false"
      AUTH_COOKIE_SECURE: "true"
      NEXT_PUBLIC_BASE_URL: https://omniroute.${DOCKER_DOMAIN}
      BASE_URL: http://127.0.0.1:20128
      OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS: "true"
    command: [/bin/sh, /app/patches/start.sh]
    volumes:
      - omniroute_data:/app/data
      - ./omniroute/start.sh:/app/patches/start.sh:ro
    mem_limit: 2g
    healthcheck:
      test: [CMD, node, healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.omniroute.rule=Host(`omniroute.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.omniroute.entrypoints=https"
      - "traefik.http.routers.omniroute.tls=true"
      - "traefik.http.services.omniroute.loadbalancer.server.port=20128"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - agent-tools
      - web-research-backend
      - proxy

  ollama-ipex:
    image: intelanalytics/ipex-llm-inference-cpp-xpu@sha256:a184d695b63690d3799a2dc1497c052bee5a7e4c1f85638ab5bd9ab80640d02b
    container_name: ollama-ipex
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_GPU: "999"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      ZES_ENABLE_SYSMAN: "1"
      ONEAPI_DEVICE_SELECTOR: level_zero:0
    command:
      - /bin/bash
      - -lc
      - source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1; mkdir -p /llm/ollama-bin; cd /llm/ollama-bin; init-ollama; ./ollama serve & pid=$$!; trap 'kill $$pid; wait $$pid' TERM INT; until ./ollama list >/dev/null 2>&1; do sleep 1; done; ./ollama pull bge-m3; wait $$pid
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [CMD-SHELL, /llm/ollama-bin/ollama show bge-m3 >/dev/null]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      agent-tools:
        aliases:
          - ollama-ipex.local

  search-ladder:
    image: ghcr.io/iamstubborn/search-ladder:latest
    container_name: search-ladder
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      omniroute:
        condition: service_healthy
    environment:
      OMNIROUTE_URL: http://omniroute:20129
      OMNIROUTE_API_KEY: ${SEARCH_LADDER_OMNIROUTE_KEY:?set SEARCH_LADDER_OMNIROUTE_KEY}
      BROKER_API_KEY: ${SEARCH_LADDER_API_KEY:?set SEARCH_LADDER_API_KEY}
      SPARK_URL: http://omniroute:20129/v1
      SPARK_API_KEY: ${SEARCH_LADDER_OMNIROUTE_KEY:?set SEARCH_LADDER_OMNIROUTE_KEY}
      SPARK_MODEL: gpt-5.6-luna
      FALLBACK_MODEL: auto/best-free
      SEARCH_PROVIDERS: exa-search,tavily-search,firecrawl,ollama-search
      DB_PATH: /data/search-ladder.db
      PAGE_CACHE_TTL: 6h
      QUOTA_COOLDOWN: 12h
    volumes:
      - search_ladder_data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    mem_limit: 128m
    healthcheck:
      test: [CMD, search-ladder, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.search-ladder.rule=Host(`search-ladder.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.search-ladder.entrypoints=https"
      - "traefik.http.routers.search-ladder.tls=true"
      - "traefik.http.services.search-ladder.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - agent-tools
      - proxy


networks:
  agent-tools:
    name: agent-tools
  web-research-backend:
    internal: true
  proxy:
    external: true

volumes:
  ollama_data:
  omniroute_data:
  omniroute_redis:
  search_ladder_data:
