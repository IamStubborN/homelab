x-locked-down: &locked-down
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-service-environment: &service-environment
  MEDIA_DATABASE_URL_FILE: /run/secrets/media_database_url
  MEDIA_ANDRII_TOKEN_FILE: /run/secrets/media_andrii_token
  MEDIA_VALENTYNA_TOKEN_FILE: /run/secrets/media_valentyna_token
  MEDIA_RUNNER_TOKEN_FILE: /run/secrets/media_runner_token
  MEDIA_LIFECYCLE_TOKEN_FILE: /run/secrets/media_lifecycle_token
  MEDIA_ANDRII_WEBHOOK_HMAC_FILE: /run/secrets/media_andrii_webhook_hmac
  MEDIA_VALENTYNA_WEBHOOK_HMAC_FILE: /run/secrets/media_valentyna_webhook_hmac
  MEDIA_ANDRII_WEBHOOK_URL: http://media-notifier-andrii:8644/webhooks/media-notify
  MEDIA_VALENTYNA_WEBHOOK_URL: http://media-notifier-valentyna:8644/webhooks/media-notify
  MEDIA_LISTEN_ADDR: 0.0.0.0:8080
  MEDIA_PROWLARR_URL: http://prowlarr:9696
  MEDIA_PROWLARR_API_KEY_FILE: /run/secrets/media_prowlarr_api_key
  MEDIA_TMDB_API_KEY_FILE: /run/secrets/media_tmdb_api_key
  MEDIA_TMDB_LANGUAGE: ${MT_TMDB_LANGUAGE:-ru}
  MEDIA_REZKA_MIRRORS: ${MEDIA_REZKA_MIRRORS:?set comma-separated HTTPS Rezka mirrors}
  MEDIA_REZKA_SESSION_PROBE_URL: ${MEDIA_REZKA_SESSION_PROBE_URL:?set the HTTPS session probe URL}
  MEDIA_REZKA_SESSION_VALID_MARKERS_JSON: ${MEDIA_REZKA_SESSION_VALID_MARKERS_JSON:?set valid session markers JSON}
  MEDIA_REZKA_SESSION_INVALID_MARKERS_JSON: ${MEDIA_REZKA_SESSION_INVALID_MARKERS_JSON:?set invalid session markers JSON}
  MEDIA_REZKA_COOKIE_KEY_FILE: /run/secrets/rezka_cookie_key
  MEDIA_REZKA_SESSION_STORE_FILE: /var/lib/media-orchestrator/session/session.bin
  MEDIA_PLEX_URL: http://plex:32400
  MEDIA_PLEX_TOKEN_FILE: /run/secrets/media_plex_token
  MEDIA_PLEX_TV_SECTION: ${MEDIA_PLEX_TV_SECTION:?set Plex TV section ID}
  MEDIA_PLEX_MOVIES_SECTION: ${MEDIA_PLEX_MOVIES_SECTION:?set Plex movies section ID}
  MEDIA_QBITTORRENT_URL: http://gluetun:8400
  MEDIA_QBITTORRENT_TV_CATEGORY: ${MEDIA_QBITTORRENT_TV_CATEGORY:?set existing TV category}
  MEDIA_QBITTORRENT_MOVIES_CATEGORY: ${MEDIA_QBITTORRENT_MOVIES_CATEGORY:?set existing movies category}
  MEDIA_QBITTORRENT_USERNAME: ${MEDIA_QBITTORRENT_USERNAME:?set qBittorrent username}
  MEDIA_QBITTORRENT_PASSWORD_FILE: /run/secrets/media_qbittorrent_password
  MEDIA_TV_ROOT: /data/internal/media/rezka/tv
  MEDIA_MOVIES_ROOT: /data/internal/media/rezka/movies
  MEDIA_REZKA_PROXY_URL: http://gluetun-rezka:8888
  RUST_LOG: ${MEDIA_RUST_LOG:-info}
  TZ: ${TIMEZONE:-UTC}

services:
  media-postgres:
    <<: *locked-down
    image: ${MEDIA_POSTGRES_IMAGE:?set MEDIA_POSTGRES_IMAGE to an immutable PostgreSQL tag or digest}
    container_name: media-postgres
    restart: unless-stopped
    read_only: true
    cap_add:
      # Required by the official entrypoint to initialize and drop to postgres.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${MEDIA_POSTGRES_DB:-media_orchestrator}
      POSTGRES_USER: ${MEDIA_POSTGRES_USER:-media}
      POSTGRES_PASSWORD_FILE: /run/secrets/media_postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - type: volume
        source: media_postgres_data
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    tmpfs:
      - /run/postgresql:size=16m,mode=0770
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    secrets:
      - media_postgres_password
    networks:
      - media-db

  media-migrate:
    <<: *locked-down
    image: ${MEDIA_SERVICE_IMAGE:?set MEDIA_SERVICE_IMAGE to an immutable media-orchestrator tag or digest}
    container_name: media-migrate
    user: ${PUID:-1000}:${PGID:-1000}
    command:
      - migrate
    restart: "no"
    read_only: true
    environment:
      MEDIA_DATABASE_URL_FILE: /run/secrets/media_database_url
      RUST_LOG: ${MEDIA_RUST_LOG:-info}
      TZ: ${TIMEZONE:-UTC}
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      media-postgres:
        condition: service_healthy
    secrets:
      - media_database_url
    networks:
      - media-db

  media-session-init:
    <<: *locked-down
    image: ${MEDIA_SERVICE_IMAGE:?set MEDIA_SERVICE_IMAGE to an immutable media-orchestrator tag or digest}
    container_name: media-session-init
    user: "0:0"
    cap_add:
      - CHOWN
    entrypoint:
      - /bin/chown
    command:
      - -R
      - ${PUID:-1000}:${PGID:-1000}
      - /var/lib/media-orchestrator/session
    restart: "no"
    read_only: true
    volumes:
      - rezka_session_encrypted:/var/lib/media-orchestrator/session

  media-service:
    <<: *locked-down
    image: ${MEDIA_SERVICE_IMAGE:?set MEDIA_SERVICE_IMAGE to an immutable media-orchestrator tag or digest}
    container_name: media-service
    user: ${PUID:-1000}:${PGID:-1000}
    command:
      - serve
    restart: unless-stopped
    read_only: true
    environment: *service-environment
    volumes:
      - type: volume
        source: rezka_session_encrypted
        target: /var/lib/media-orchestrator/session
        volume:
          nocopy: true
      - type: bind
        source: ${INTERNAL_STORAGE:?set INTERNAL_STORAGE to the storage root}
        target: /data/internal
        bind:
          create_host_path: false
    secrets:
      - media_database_url
      - media_andrii_token
      - media_valentyna_token
      - media_runner_token
      - media_lifecycle_token
      - media_andrii_webhook_hmac
      - media_valentyna_webhook_hmac
      - media_prowlarr_api_key
      - media_tmdb_api_key
      - rezka_cookie_key
      - media_plex_token
      - media_qbittorrent_password
    expose:
      - "8080"
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - media
        - healthcheck
        - --url
        - http://127.0.0.1:8080/v1/ready
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      media-postgres:
        condition: service_healthy
      media-migrate:
        condition: service_completed_successfully
      media-session-init:
        condition: service_completed_successfully
    labels:
      traefik.enable: "false"
    networks:
      - media-db
      - media-private
      - media-internal
      - proxy

  gluetun-rezka:
    <<: *locked-down
    image: ${GLUETUN_REZKA_IMAGE:?set GLUETUN_REZKA_IMAGE to an immutable Gluetun tag or digest}
    container_name: gluetun-rezka
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - DAC_READ_SEARCH
      # Gluetun persists the detected public IP after dropping to PUID/PGID.
      - CHOWN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TIMEZONE:-UTC}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/gluetun_rezka_wireguard_private_key
      SERVER_COUNTRIES: ${GLUETUN_REZKA_SERVER_COUNTRIES:?set dedicated Rezka VPN countries}
      VPN_PORT_FORWARDING: "off"
      HEALTH_RESTART_VPN: "off"
      DNS_SERVER: "on"
      DNS_UPSTREAM_RESOLVERS: cloudflare,google
      BLOCK_MALICIOUS: "off"
      DNS_UPSTREAM_IPV6: "off"
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /run/secrets/gluetun_rezka_control_auth_config
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: :8888
      HTTPPROXY_STEALTH: "on"
      FIREWALL_OUTBOUND_SUBNETS: ${GLUETUN_REZKA_OUTBOUND_SUBNETS:?set the Docker subnets reachable outside the VPN}
    secrets:
      - gluetun_rezka_wireguard_private_key
      - gluetun_rezka_control_auth_config
    volumes:
      - type: volume
        source: gluetun_rezka_state
        target: /gluetun
        volume:
          nocopy: true
    tmpfs:
      - /tmp/gluetun:rw,nosuid,nodev,noexec,size=16m,mode=0755
    healthcheck:
      test:
        - CMD
        - /gluetun-entrypoint
        - healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: "false"
    networks:
      - media-private
      - rezka-egress
      - rezka-credentials
      - proxy

  download-runner:
    <<: *locked-down
    image: ${DOWNLOAD_RUNNER_IMAGE:?set DOWNLOAD_RUNNER_IMAGE to an immutable media-orchestrator runner tag or digest}
    container_name: download-runner
    user: ${PUID:-1000}:${PGID:-1000}
    command:
      - runner
    restart: "no"
    read_only: true
    network_mode: service:gluetun-rezka
    group_add:
      - ${RENDER_GID:-109}
      - ${VIDEO_GID:-44}
    devices:
      - /dev/dri:/dev/dri
    environment:
      MEDIA_SERVICE_URL: http://media-service:8080
      MEDIA_TOKEN_FILE: /run/secrets/media_runner_token
      MEDIA_REZKA_MIRRORS: ${MEDIA_REZKA_MIRRORS:?set comma-separated HTTPS Rezka mirrors}
      MEDIA_REZKA_SESSION_PROBE_URL: ${MEDIA_REZKA_SESSION_PROBE_URL:?set the HTTPS session probe URL}
      MEDIA_REZKA_SESSION_VALID_MARKERS_JSON: ${MEDIA_REZKA_SESSION_VALID_MARKERS_JSON:?set valid session markers JSON}
      MEDIA_REZKA_SESSION_INVALID_MARKERS_JSON: ${MEDIA_REZKA_SESSION_INVALID_MARKERS_JSON:?set invalid session markers JSON}
      MEDIA_REZKA_CREDENTIAL_BROKER_URL: http://vaultwarden-broker-andrii:8787
      MEDIA_REZKA_CREDENTIAL_BROKER_TOKEN_FILE: /run/secrets/media_andrii_rezka_broker_token
      MEDIA_REZKA_CREDENTIAL_BROKER_PRIVATE_HTTP_HOSTS: vaultwarden-broker-andrii
      MEDIA_REZKA_COOKIE_KEY_FILE: /run/secrets/rezka_cookie_key
      MEDIA_REZKA_SESSION_STORE_FILE: /var/lib/media-orchestrator/session/session.bin
      MEDIA_RUNNER_EXIT_AFTER_JOB: "true"
      MEDIA_QBITTORRENT_URL: http://gluetun:8400
      MEDIA_QBITTORRENT_TV_CATEGORY: ${MEDIA_QBITTORRENT_TV_CATEGORY:?set existing TV category}
      MEDIA_QBITTORRENT_MOVIES_CATEGORY: ${MEDIA_QBITTORRENT_MOVIES_CATEGORY:?set existing movies category}
      MEDIA_QBITTORRENT_USERNAME: ${MEDIA_QBITTORRENT_USERNAME:?set qBittorrent username}
      MEDIA_QBITTORRENT_PASSWORD_FILE: /run/secrets/media_qbittorrent_password
      MEDIA_STAGING_ROOT: /data/internal/media-orchestrator/staging/rezka
      MEDIA_TV_ROOT: /data/internal/media/rezka/tv
      MEDIA_MOVIES_ROOT: /data/internal/media/rezka/movies
      MEDIA_STORAGE_RESERVE_BYTES: "0"
      TMPDIR: /run/yt-dlp
      RUST_LOG: ${MEDIA_RUST_LOG:-info}
      TZ: ${TIMEZONE:-UTC}
    secrets:
      - media_runner_token
      - media_andrii_rezka_broker_token
      - rezka_cookie_key
      - media_qbittorrent_password
    volumes:
      # One bind mount preserves atomic rename between staging and Plex roots.
      - type: bind
        source: ${INTERNAL_STORAGE:?set INTERNAL_STORAGE to the storage root}
        target: /data/internal
        bind:
          create_host_path: false
      - type: volume
        source: rezka_session_encrypted
        target: /var/lib/media-orchestrator/session
        volume:
          nocopy: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /run/media-orchestrator:size=16m,mode=0700
      - /run/yt-dlp:rw,nosuid,nodev,exec,size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - media
        - healthcheck
        - --url
        - http://media-service:8080/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      gluetun-rezka:
        condition: service_healthy
      media-service:
        condition: service_healthy
      media-session-init:
        condition: service_completed_successfully

  gluetun-rezka-watcher:
    <<: *locked-down
    image: ${GLUETUN_REZKA_WATCHER_IMAGE:?set GLUETUN_REZKA_WATCHER_IMAGE to an immutable Docker CLI tag or digest}
    container_name: gluetun-rezka-watcher
    restart: unless-stopped
    read_only: true
    environment:
      MEDIA_LIFECYCLE_TOKEN_FILE: /run/secrets/media_lifecycle_token
      PARENT_CONTAINER: gluetun-rezka
      DEPENDENT_CONTAINER: download-runner
      HEALTH_TIMEOUT: "120"
      SETTLE_DELAY: "10"
      ROTATION_ATTEMPTS: "3"
      REZKA_PROBE_URL: ${MEDIA_REZKA_SESSION_PROBE_URL:?set the HTTPS Rezka probe URL}
      REZKA_PROBE_TIMEOUT: "20"
      STATE_DIR: /state
    secrets:
      - media_lifecycle_token
    networks:
      - media-internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gluetun-rezka-watcher/watch.sh:/watch.sh:ro
      - gluetun_rezka_lifecycle:/state
    tmpfs:
      - /tmp:size=16m,mode=1777
    entrypoint:
      - /bin/sh
      - /watch.sh
    healthcheck:
      test:
        - CMD
        - docker
        - info
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      gluetun-rezka:
        condition: service_healthy

secrets:
  gluetun_rezka_wireguard_private_key:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/gluetun_rezka_wireguard_private_key
  gluetun_rezka_control_auth_config:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/gluetun_rezka_control_auth_config
  media_database_url:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_database_url
  media_andrii_token:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_andrii_token
  media_valentyna_token:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_valentyna_token
  media_runner_token:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_runner_token
  media_lifecycle_token:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_lifecycle_token
  media_andrii_webhook_hmac:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_andrii_webhook_hmac
  media_valentyna_webhook_hmac:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_valentyna_webhook_hmac
  media_prowlarr_api_key:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_prowlarr_api_key
  media_tmdb_api_key:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_tmdb_api_key
  rezka_cookie_key:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/rezka_cookie_key
  media_plex_token:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_plex_token
  media_qbittorrent_password:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_qbittorrent_password
  media_postgres_password:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/media_postgres_password
  media_andrii_rezka_broker_token:
    file: ${MEDIA_SECRETS_DIR:?set MEDIA_SECRETS_DIR}/andrii_rezka_broker_token

volumes:
  # Preserve the existing data while this stack moves under the homelab project.
  media_postgres_data:
    name: media-orchestrator_media_postgres_data
    external: true
  gluetun_rezka_state:
    name: media-orchestrator_gluetun_rezka_state
    external: true
  gluetun_rezka_lifecycle:
    name: media-orchestrator_gluetun_rezka_lifecycle
    external: true
  rezka_session_encrypted:
    name: media-orchestrator_rezka_session_encrypted
    external: true

networks:
  media-db:
    internal: true
  media-private:
    internal: true
  media-internal:
    name: ${MEDIA_NETWORK:-media-internal}
    external: true
  rezka-egress:
  rezka-credentials:
    name: rezka-credentials
    external: true
  proxy:
    external: true
