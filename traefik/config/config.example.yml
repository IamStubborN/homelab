# Replace ${DOCKER_DOMAIN} with the domain, and ${DOCKER_DOMAIN_REGEX} with the
# same domain with every dot written as [.] (a bare dot matches any character).
http:
  routers:
    # TorrServer has no login and answers any origin (CORS *), so a web page in
    # a LAN browser could read or change it. /shutdown is always refused, also
    # behind extra slashes or /torrservershutdown, which the prefix strip turns
    # into /shutdown.
    # Requests from a foreign page (an Origin that is not Lampa or TorrServer,
    # or a cross-site request without one) are refused by the *-foreign
    # routers and logged, so a client caught by them shows up in the log.
    torrserver-shutdown:
      rule: "(Host(`torrserver.${DOCKER_DOMAIN}`) && PathRegexp(`^/+shutdown(/|$)`)) || (Host(`lampa.${DOCKER_DOMAIN}`) && PathRegexp(`^/torrserver/*shutdown(/|$)`))"
      entryPoints: [https]
      tls: {}
      priority: 300
      service: torrserver@docker
      middlewares: [deny-all]
    torrserver-shutdown-http:
      rule: "Host(`torrserver.${DOCKER_DOMAIN}`) && PathRegexp(`^/+shutdown(/|$)`)"
      entryPoints: [http]
      priority: 300
      service: torrserver@docker
      middlewares: [deny-all]
    torrserver-foreign:
      rule: "Host(`torrserver.${DOCKER_DOMAIN}`) && ((HeaderRegexp(`Origin`, `.`) && !HeaderRegexp(`Origin`, `^https?://(lampa|torrserver)[.]${DOCKER_DOMAIN_REGEX}$`)) || (Header(`Sec-Fetch-Site`, `cross-site`) && !HeaderRegexp(`Origin`, `.`)))"
      entryPoints: [https]
      tls: {}
      priority: 250
      service: torrserver@docker
      middlewares: [deny-all]
      observability:
        accessLogs: true
    torrserver-foreign-http:
      rule: "Host(`torrserver.${DOCKER_DOMAIN}`) && ((HeaderRegexp(`Origin`, `.`) && !HeaderRegexp(`Origin`, `^https?://(lampa|torrserver)[.]${DOCKER_DOMAIN_REGEX}$`)) || (Header(`Sec-Fetch-Site`, `cross-site`) && !HeaderRegexp(`Origin`, `.`)))"
      entryPoints: [http]
      priority: 250
      service: torrserver@docker
      middlewares: [deny-all]
      observability:
        accessLogs: true
    lampa-torrserver-foreign:
      rule: "Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/torrserver`) && ((HeaderRegexp(`Origin`, `.`) && !HeaderRegexp(`Origin`, `^https?://(lampa|torrserver)[.]${DOCKER_DOMAIN_REGEX}$`)) || (Header(`Sec-Fetch-Site`, `cross-site`) && !HeaderRegexp(`Origin`, `.`)))"
      entryPoints: [https]
      tls: {}
      priority: 250
      service: torrserver@docker
      middlewares: [deny-all]
      observability:
        accessLogs: true
    # Below lampa-gst-sessions (120): only the paths that reach TorrServer.
    lampa-torrserver-gst-foreign:
      rule: "Host(`lampa.${DOCKER_DOMAIN}`) && PathPrefix(`/gst`) && ((HeaderRegexp(`Origin`, `.`) && !HeaderRegexp(`Origin`, `^https?://(lampa|torrserver)[.]${DOCKER_DOMAIN_REGEX}$`)) || (Header(`Sec-Fetch-Site`, `cross-site`) && !HeaderRegexp(`Origin`, `.`)))"
      entryPoints: [https]
      tls: {}
      priority: 110
      service: torrserver@docker
      middlewares: [deny-all]
      observability:
        accessLogs: true

    http-catchall-redirect:
      rule: "HostRegexp(`^.+$`)"
      entryPoints:
        - http
      middlewares:
        - redirect-to-https
      service: api@internal
      priority: 1

    # Keep legacy TorrServer hashes on its existing route; numeric Lampac
    # session IDs isolate simultaneous browser viewers.
    lampa-gst-sessions:
      rule: "Host(`lampa.${DOCKER_DOMAIN}`) && (PathRegexp(`^/gst/[0-9]{1,20}/`) || PathRegexp(`^/gst/(add|probe|start[.]m3u8|remove)$`) || PathRegexp(`^/gst/(tracks/)?js/[^/]+$`) || Path(`/gst.js`) || Path(`/gst/tracks.js`))"
      entryPoints: [https]
      tls: {}
      priority: 120
      service: lampa@docker
      middlewares: [lampa-forwarded@docker]
      observability:
        accessLogs: true

    homeassistant:
      rule: "Host(`homeassistant.${DOCKER_DOMAIN}`)"
      entryPoints:
        - https
      tls:
        certResolver: cloudflare
      service: homeassistant

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://${LAN_BIND_IP:-127.0.0.1}:8123"

  middlewares:
    # Matches no client address: every request through it gets 403.
    deny-all:
      ipAllowList:
        sourceRange:
          - "0.0.0.0/32"
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

